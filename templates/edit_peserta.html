{% extends 'base.html' %}
{% block title %}Edit Peserta - Sertifikat Manager{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Edit Peserta</h1>
    <a href="{{ url_for('peserta', pelatihan_id=peserta.pelatihan_id) }}" class="btn btn-secondary">Kembali</a>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="nama_peserta">Nama Lengkap</label>
            <input type="text" class="form-control" id="nama_peserta" name="nama_peserta" required value="{{ peserta.nama_peserta }}">
        </div>
        <div class="form-group">
            <label class="form-label" for="perusahaan">Perusahaan</label>
            <input type="text" class="form-control" id="perusahaan" name="perusahaan" value="{{ peserta.perusahaan or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label" for="keterangan">Keterangan (Opsional)</label>
            <input type="text" class="form-control" id="keterangan" name="keterangan" value="{{ peserta.keterangan or '' }}">
        </div>
        <div style="margin-top: 2rem;">
            <button type="submit" class="btn btn-primary" style="width: 100%;">Simpan Perubahan</button>
        </div>
    </form>
</div>
{% endblock %}
